<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 3 · 에이전트 콘솔</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{--bg:#08080a;--card:#131316;--card2:#1c1c20;--edge:#2a2a2f;--fg:#f4f4f5;--mute:#a1a1a8;--hot:#ff6a1f;--good:#3ddc84}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;font-size:14.5px;line-height:1.5;display:flex;flex-direction:column}
.mono{font-family:"Geist Mono",ui-monospace,Consolas,monospace}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--edge)}
header strong{font-weight:600;font-size:16px}
.steps{display:flex;gap:6px;margin-left:10px;font-size:13px;color:var(--mute)}
.steps span{padding:4px 11px;border-radius:999px;border:1px solid var(--edge)}
.steps .done{color:var(--good);border-color:#1f5a3b}
.steps .now{color:#160700;background:var(--hot);border-color:var(--hot);font-weight:700}
.spacer{flex:1}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--edge);border-radius:999px;padding:6px 13px;cursor:pointer}
button.go{background:var(--hot);border-color:var(--hot);color:#160700;font-weight:700}
main{flex:1;min-height:0;display:grid;grid-template-columns:300px minmax(0,1fr) 470px}
section{min-height:0;overflow:auto;padding:18px 20px;border-right:1px solid var(--edge)}
section:last-child{border-right:0;padding:0;display:flex;flex-direction:column}
h2{margin:0 0 12px;font-size:12.5px;font-weight:600;color:var(--mute);letter-spacing:.05em}
.src{padding:12px;border:1px solid var(--edge);border-radius:12px;background:var(--card);margin-bottom:10px;transition:border-color .15s,opacity .15s}
.src.on{border-color:var(--hot)}
.picked .src:not(.on){opacity:.35}
.src .id{color:var(--hot);font-size:12px;font-weight:700}
.src p{margin:5px 0 0;font-size:13.5px}
.src small{color:var(--mute);display:block;margin-top:6px;font-size:12px}
.cert{margin-top:16px;padding:12px;border-radius:12px;background:#0f2a1c;color:var(--good);font-size:13px}
.cert b{display:block;font-size:14px;margin-bottom:2px}
.rivals{margin-top:16px;font-size:13px;color:var(--mute)}
.rivals code{display:block;margin-top:4px;color:var(--fg)}
.feat{border:1px solid var(--edge);border-radius:14px;background:var(--card);margin-bottom:12px;overflow:hidden;transition:border-color .15s}
.feat.on{border-color:var(--hot)}
.feat>button{display:flex;width:100%;gap:12px;align-items:center;border:0;border-radius:0;padding:14px 16px;text-align:left}
.box{width:18px;height:18px;border-radius:5px;border:1.5px solid #62626a;flex:none}
.feat .id{font-size:12px;color:var(--mute)}
.feat h3{margin:0;font-size:15px;font-weight:600}
.feat .why{margin-left:auto;font-size:12px;color:var(--mute);white-space:nowrap}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--edge);border-top:1px solid var(--edge)}
.slot{background:var(--card);padding:10px 14px;font-size:13px}
.slot span{display:block;font-size:11.5px;color:var(--mute);margin-bottom:2px}
.slot.open{background:#22140c}
.slot.open em{font-style:normal;color:var(--hot);font-weight:600}
.open-note{margin:2px 0 16px;font-size:13px;color:var(--mute)}
.open-note b{color:var(--hot)}
.hold{margin-top:6px;padding:12px 14px;border:1.5px dashed #4a4a52;border-radius:12px;color:var(--mute);font-size:13.5px}
.hold b{color:var(--fg);font-weight:600}
.termbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--edge);font-size:12.5px;color:var(--mute)}
.termbar i{width:10px;height:10px;border-radius:50%;background:#3a3a41}
.termbar button{margin-left:auto;padding:3px 10px;font-size:12px}
pre{margin:0;padding:16px;flex:1;overflow:auto;font-size:12.5px;line-height:1.65;white-space:pre-wrap;color:#d4d4d8}
pre .p{color:var(--hot)} pre .t{color:var(--good)} pre .d{color:#7a7a82} pre .hl{background:#2a1a10;color:#ffd9c2}
@media (max-width:1100px){main{grid-template-columns:1fr}section{border-right:0;border-bottom:1px solid var(--edge);overflow:visible}body{height:auto}.steps{display:none}.slots{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <strong id="title"></strong>
  <div class="steps"><span class="done">1 근거 모으기</span><span class="done">2 스펙</span><span class="now">3 에이전트에 넘기기</span></div>
  <div class="spacer"></div>
  <button>AGENTS.md 내려받기</button><button class="go">연결 명령 복사</button>
</header>
<main id="main">
  <section>
    <h2>근거 원문</h2>
    <div id="E"></div>
    <div class="cert"><b>근거 기준 통과</b>증언 3건 · 플랫폼 2종 · 전부 원문 일치</div>
    <div class="rivals">이미 있는 도구 4개<span id="rivals"></span></div>
  </section>

  <section>
    <h2>만들 기능, 순서대로</h2>
    <p class="open-note">에이전트가 추측하지 않도록 기능마다 여섯 가지를 정해 둡니다. <b>정해지지 않은 칸</b>은 에이전트가 먼저 질문합니다.</p>
    <div id="F"></div>
    <div class="hold"><b>만들지 않을 것 2개.</b> 원문이 뒷받침하지 않는 가설 H-01, H-02는 에이전트 지침에서 범위 밖으로 표시됩니다.</div>
  </section>

  <section>
    <div class="termbar"><i></i><i></i><i></i><span class="mono">claude · ~/my-project</span><button id="replay">다시 재생</button></div>
    <pre class="mono" id="term"></pre>
  </section>
</main>

<script src="shared.js"></script>
<script>
const S = window.SPEC;
title.textContent = S.title;
E.innerHTML = S.evidence.map((e) => `<div class="src" data-id="${e.id}"><span class="id mono">${e.id}</span><p>“${e.quote}”</p><small>${e.platform} · ${e.date} · 원문 일치</small></div>`).join('');
rivals.innerHTML = S.rivals.map((name) => `<code class="mono">${name}</code>`).join('');
F.innerHTML = S.features.map((f) => `<div class="feat" data-id="${f.id}"><button><span class="box"></span><span><span class="id mono">${f.id}</span><h3>${f.title}</h3></span><span class="why mono">${[...traceOf(f.id)].filter((x) => /^[RE]/.test(x)).sort().join(' · ')}</span></button><div class="slots">${Object.entries(f.slots).map(([key, value]) => `<div class="slot${value ? '' : ' open'}"><span>${key}</span>${value ?? '<em>정해지지 않음 · 먼저 물어볼 것</em>'}</div>`).join('')}</div></div>`).join('');

const lines = (hot) => [
  ['p', '> '], ['', 'Seedup에서 모델 스키마 문제를 찾아서 검증된 스펙으로 첫 기능을 만들어 줘\n\n'],
  ['t', '● seedup · search_opportunities'], ['d', '  ("llm provider schema")\n'],
  ['', '  제공사별 모델 스키마 차이 — verified, 3 quotes on hn, stackoverflow,\n  4 direct competitors, status narrowing\n\n'],
  ['t', '● seedup · generate_verified_prd'], ['d', '  (format: "agents")\n'],
  ['', '  Save as AGENTS.md:\n\n'],
  ['d', '  ## Build these features, in order\n'],
  ...S.features.map((f) => [f.id === hot ? 'hl' : '', `  - [ ] ${f.id}. ${f.title}\n      Serves: ${f.up.join(', ')} (evidence ${[...traceOf(f.id)].filter((x) => x.startsWith('E')).sort().join(', ')})\n`]),
  ['d', '\n  ## Rules\n'],
  ['', '  - Every feature must trace to user evidence. Ask first.\n  - Out of scope until validated: H-01, H-02\n\n'],
  ['t', '● Write'], ['d', '  AGENTS.md\n\n'],
  ['', 'F-01의 완료 기준이 정해지지 않았습니다. 구현 전에 확인할게요:\n'],
  ['hl', '어떤 상태가 되면 F-01이 끝난 것으로 볼까요?\n'],
];
let timer;
function play(hot, instant) {
  clearInterval(timer);
  const list = lines(hot);
  const render = (n) => { term.innerHTML = list.slice(0, n).map(([cls, text]) => `<span class="${cls}">${text.replace(/</g, '&lt;')}</span>`).join(''); term.scrollTop = term.scrollHeight; };
  if (instant) return render(list.length);
  let n = 0;
  timer = setInterval(() => { render(++n); if (n >= list.length) clearInterval(timer); }, 220);
}
function pick(id) {
  const ids = traceOf(id);
  main.classList.add('picked');
  document.querySelectorAll('[data-id]').forEach((el) => el.classList.toggle('on', ids.has(el.dataset.id)));
  play(id, true);
}
F.addEventListener('click', (event) => { const el = event.target.closest('.feat'); if (el) pick(el.dataset.id); });
replay.addEventListener('click', () => play(null, false));
if (location.hash === '#demo') pick('F-01'); else play(null, matchMedia('(prefers-reduced-motion: reduce)').matches);
</script>
</body>
</html>
