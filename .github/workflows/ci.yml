name: CI

on:
  pull_request:
  # The merge queue runs the required checks (check, migrations, e2e) again on main plus the queued PRs before merging.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Migration names and order, and lib/schema-manifest.json in step with the SQL (the schema check must parse it).
      - run: npm run migrations
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Applies every migration and supabase/seed.sql to an empty local Supabase database, so SQL that only worked on the
  # live database fails here rather than in `supabase db push`. Runs beside `check`, so it adds no time to it.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - run: supabase db start
      - name: Every migration is applied
        run: |
          supabase migration list | tee list.txt
          for file in supabase/migrations/*.sql; do
            version=$(basename "$file" | cut -d_ -f1)
            grep -qE "$version.*\|.*$version" list.txt || { echo "::error::$file was not applied"; exit 1; }
          done

  # The core flow in a real browser (idea → questions → PRD → AGENTS.md) on a build started in this runner, with fixed
  # model answers (LLM_FIXTURES=1), signed in as the test account against a local Supabase instance.
  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start local Supabase
        run: |
          supabase start -x studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL:-http://127.0.0.1:54321}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-trace
          path: test-results/
          retention-days: 7

  # Each pull request from this repository gets its own preview address: the build is uploaded as a Worker version
  # under a "pr-N" alias without becoming the live version. It runs with the live Worker's secrets, so it reads and
  # writes the production database, and sign-in returns to the live site; use it to look at screens, not to test data.
  preview:
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.number }}
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build and upload a preview version
        run: |
          npm ci
          npx opennextjs-cloudflare build
          npx opennextjs-cloudflare upload --preview-alias "pr-${{ github.event.number }}" --message "PR #${{ github.event.number }}" 2>&1 | tee upload.log
      - name: Post the preview address on the pull request
        run: |
          url=$(grep -oE 'https://pr-${{ github.event.number }}-[^ ]+\.workers\.dev' upload.log | head -1)
          [ -z "$url" ] && url=$(grep -oE 'https://[a-z0-9-]+-seedup-ver2\.[^ ]+\.workers\.dev' upload.log | head -1)
          if [ -z "$url" ]; then echo "::warning::No preview address in the upload output."; exit 0; fi
          body="미리보기: $url (커밋 ${HEAD_SHA::7}). 운영 DB를 그대로 쓰니 화면 확인용으로만 써 주세요."
          gh pr comment ${{ github.event.number }} --edit-last --body "$body" 2>/dev/null || gh pr comment ${{ github.event.number }} --body "$body"

  # Every push to main that passes the checks above goes live on Cloudflare.
  deploy:
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-cloudflare
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # NEXT_PUBLIC values are fixed into the bundle at build time. Server secrets live on the Worker and are not touched.
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check deploy settings
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$NEXT_PUBLIC_SITE_URL" ]; then
            echo "::warning::Not deployed. Add the CLOUDFLARE_API_TOKEN secret, and the CLOUDFLARE_ACCOUNT_ID and SITE_URL variables."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Build and deploy
        if: steps.ready.outputs.ready == 'true'
        run: |
          npm ci
          npx opennextjs-cloudflare build
          npx opennextjs-cloudflare deploy
      - name: Check the site answers
        if: steps.ready.outputs.ready == 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            status=$(curl --silent --output /dev/null --max-time 30 --write-out '%{http_code}' "$NEXT_PUBLIC_SITE_URL/opportunities" || echo 000)
            if [ "$status" = "200" ]; then echo "live: $status"; exit 0; fi
            sleep 10
          done
          echo "The site answered $status after deploying."
          exit 1
