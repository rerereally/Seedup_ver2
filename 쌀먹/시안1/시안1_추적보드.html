<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 1 · 추적 보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{--bg:#08080a;--card:#131316;--card2:#1c1c20;--edge:#2a2a2f;--fg:#f4f4f5;--mute:#a1a1a8;--hot:#ff6a1f;--good:#3ddc84}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;font-size:15px;line-height:1.5}
.mono{font-family:"Geist Mono",ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;gap:16px;padding:18px 32px;border-bottom:1px solid var(--edge)}
.crumb{color:var(--mute);font-size:14px}
h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}
.pass{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;background:#0f2a1c;color:var(--good);font-size:13px;font-weight:600}
.pass i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.spacer{flex:1}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--edge);border-radius:999px;padding:8px 14px;cursor:pointer}
button:hover{border-color:#62626a}
button.go{background:var(--hot);border-color:var(--hot);color:#160700;font-weight:700}
.lead{padding:18px 32px 0;color:var(--mute);max-width:980px}
.lead b{color:var(--fg);font-weight:500}
.board{position:relative;display:grid;grid-template-columns:minmax(0,1.25fr) repeat(3,minmax(0,1fr));gap:56px;padding:22px 32px 8px}
svg.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
svg.wires path{fill:none;stroke:#4a4a52;stroke-width:1.5;transition:stroke .15s,opacity .15s}
svg.wires path.on{stroke:var(--hot);stroke-width:2}
.board.picked svg.wires path:not(.on){opacity:.25}
.col h2{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--mute);letter-spacing:.04em;display:flex;justify-content:space-between}
.col{position:relative;z-index:1;display:flex;flex-direction:column;gap:12px}
.card{width:100%;background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:14px;cursor:pointer;text-align:left;transition:border-color .15s,opacity .15s,transform .15s}
.card:hover{border-color:#62626a}
.card.on{border-color:var(--hot);box-shadow:0 0 0 1px var(--hot) inset}
.board.picked .card:not(.on){opacity:.32}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:6px;background:var(--card2);color:var(--mute);margin-bottom:8px}
.card.on .tag{background:var(--hot);color:#160700;font-weight:700}
.card h3{margin:0 0 4px;font-size:15px;font-weight:600}
.card p{margin:0;color:var(--mute);font-size:13.5px}
.quote{font-size:14.5px;color:var(--fg)!important;margin-bottom:6px!important}
.meta{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:var(--mute)}
.ok{color:var(--good);font-weight:600}
.meta a{color:var(--mute);margin-left:auto}
.chain{margin:6px 32px 0;padding:12px 16px;border-radius:12px;background:var(--card);border:1px solid var(--edge);min-height:46px;color:var(--mute);font-size:14px}
.chain b{color:var(--hot);font-weight:600}
.hold{margin:20px 32px 40px;padding:18px;border:1.5px dashed #4a4a52;border-radius:16px}
.hold h2{margin:0 0 4px;font-size:15px;font-weight:600}
.hold>p{margin:0 0 14px;color:var(--mute);font-size:14px}
.hrow{display:grid;grid-template-columns:repeat(2,1fr) auto;gap:12px;align-items:stretch}
.h{border:1px dashed #4a4a52;border-radius:12px;padding:12px;color:var(--mute)}
.h h3{margin:0 0 2px;font-size:14.5px;color:var(--fg);font-weight:600}
.h .tag{background:transparent;border:1px dashed #4a4a52}
@media (max-width:1000px){.board{grid-template-columns:minmax(0,1fr);gap:20px}svg.wires{display:none}.hrow{grid-template-columns:1fr}header{flex-wrap:wrap;padding:14px 16px}.board,.lead{padding-left:16px;padding-right:16px}.chain,.hold{margin-left:16px;margin-right:16px}header button{padding:6px 10px;font-size:13px}}
</style>
</head>
<body>
<header>
  <div>
    <div class="crumb">기회 / 스펙 작업 화면</div>
    <h1 id="title"></h1>
  </div>
  <span class="pass"><i></i>근거 기준 통과 · 증언 3건 · 플랫폼 2종</span>
  <div class="spacer"></div>
  <button>AGENTS.md</button><button>CLAUDE.md</button><button>.cursorrules</button>
  <button class="go">에이전트에 넘기기</button>
</header>
<p class="lead"><b id="problem"></b> 아무 카드나 누르면 그 항목이 기대는 원문과, 그 항목에 기대는 기능·화면이 함께 켜집니다.</p>

<div class="board" id="board">
  <svg class="wires" id="wires"></svg>
  <div class="col" id="colE"><h2>증언 <span class="mono">E</span></h2></div>
  <div class="col" id="colR"><h2>요구사항 <span class="mono">R</span></h2></div>
  <div class="col" id="colF"><h2>기능 <span class="mono">F</span></h2></div>
  <div class="col" id="colS"><h2>화면 <span class="mono">S</span></h2></div>
</div>
<div class="chain" id="chain">카드를 눌러 사슬을 따라가 보세요.</div>

<section class="hold">
  <h2>가설 보관 구역</h2>
  <p>모델이 제안했지만 뒷받침하는 원문이 없어 요구사항에서 뺀 항목입니다. 사용자에게 확인하기 전에는 만들지 않습니다.</p>
  <div class="hrow" id="hyp"><button>확인할 사람 찾기</button></div>
</section>

<script src="shared.js"></script>
<script>
const S = window.SPEC;
document.getElementById('title').textContent = S.title;
document.getElementById('problem').textContent = S.problem;
const card = (item, body) => `<button class="card" data-id="${item.id}"><span class="tag mono">${item.id}</span>${body}</button>`;
colE.insertAdjacentHTML('beforeend', S.evidence.map((e) => card(e, `<p class="quote">“${e.quote}”</p><p>${e.ko}</p><div class="meta"><span>${e.platform}</span><span class="mono">${e.date}</span><span class="ok">원문 일치</span><a href="${e.url}">원문 열기</a></div>`)).join(''));
for (const [col, list] of [[colR, S.requirements], [colF, S.features], [colS, S.screens]])
  col.insertAdjacentHTML('beforeend', list.map((x) => card(x, `<h3>${x.title}</h3><p>${x.detail}</p>`)).join(''));
hyp.insertAdjacentHTML('afterbegin', S.hypotheses.map((h) => `<div class="h"><span class="tag mono">${h.id}</span><h3>${h.title}</h3>${h.detail}</div>`).join(''));

const edges = [...S.requirements, ...S.features, ...S.screens].flatMap((x) => x.up.map((from) => [from, x.id]));
function draw() {
  const box = board.getBoundingClientRect();
  wires.innerHTML = edges.map(([a, b]) => {
    const A = board.querySelector(`[data-id="${a}"]`).getBoundingClientRect();
    const B = board.querySelector(`[data-id="${b}"]`).getBoundingClientRect();
    const x1 = A.right - box.left, y1 = A.top + A.height / 2 - box.top, x2 = B.left - box.left, y2 = B.top + B.height / 2 - box.top, mid = (x1 + x2) / 2;
    return `<path data-a="${a}" data-b="${b}" d="M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}"/>`;
  }).join('');
}
let picked = null;
function pick(id) {
  picked = picked === id ? null : id;
  paint();
}
function paint() {
  const ids = picked ? traceOf(picked) : new Set();
  board.classList.toggle('picked', Boolean(picked));
  board.querySelectorAll('.card').forEach((el) => el.classList.toggle('on', ids.has(el.dataset.id)));
  wires.querySelectorAll('path').forEach((p) => p.classList.toggle('on', ids.has(p.dataset.a) && ids.has(p.dataset.b)));
  const group = (prefix) => [...ids].filter((x) => x.startsWith(prefix)).sort().join(', ');
  chain.innerHTML = picked
    ? `<b>${picked}</b> 의 사슬: 원문 ${group('E') || '없음'} · 요구사항 ${group('R') || '없음'} · 기능 ${group('F') || '없음'} · 화면 ${group('S') || '없음'}`
    : '카드를 눌러 사슬을 따라가 보세요.';
}
board.addEventListener('click', (event) => { const el = event.target.closest('.card'); if (el && !event.target.closest('a')) pick(el.dataset.id); });
const redraw = () => { draw(); paint(); };
addEventListener('resize', redraw);
document.fonts?.ready.then(redraw);
redraw();
if (location.hash === '#demo') pick('S-02');
</script>
</body>
</html>
