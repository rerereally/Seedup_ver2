name: Scheduled ingest

on:
  schedule:
    # 06:00 KST every day. Scheduled runs only start from the default branch.
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # With SEEDUP_SITE_URL set, the deployed site does the collecting. Without it, the app is built
      # and started inside this runner, so collection works before anything is deployed.
      SITE_URL: ${{ secrets.SEEDUP_SITE_URL }}
      REMOTE_INGEST_SECRET: ${{ secrets.SEEDUP_INGEST_SECRET }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      OPENROUTER_FALLBACK_MODELS: ${{ vars.OPENROUTER_FALLBACK_MODELS }}
      OPENROUTER_FREE_ONLY: ${{ vars.OPENROUTER_FREE_ONLY }}
      RAG_EMBEDDING_MODEL: ${{ vars.RAG_EMBEDDING_MODEL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Choose where to collect
        id: mode
        run: |
          if [ -n "$SITE_URL" ] && [ -n "$REMOTE_INGEST_SECRET" ]; then
            echo "mode=remote" >> "$GITHUB_OUTPUT"
          elif [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ] && [ -n "$SUPABASE_SECRET_KEY" ] && [ -n "$OPENROUTER_API_KEY" ] && [ -n "$OPENROUTER_MODEL" ]; then
            echo "mode=local" >> "$GITHUB_OUTPUT"
          else
            echo "Set either SEEDUP_SITE_URL and SEEDUP_INGEST_SECRET, or the Supabase and OpenRouter secrets plus the OPENROUTER_MODEL variable."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.mode.outputs.mode == 'local'
      - uses: actions/setup-node@v4
        if: steps.mode.outputs.mode == 'local'
        with:
          node-version: 22
          cache: npm

      - name: Build and start the app in this runner
        if: steps.mode.outputs.mode == 'local'
        run: |
          # The secret only has to match between this server and the requests below, so it is made per run.
          INGEST_SECRET="$(openssl rand -hex 24)"
          echo "::add-mask::$INGEST_SECRET"
          echo "INGEST_SECRET=$INGEST_SECRET" >> "$GITHUB_ENV"
          echo "SITE_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          export INGEST_SECRET NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000
          npm ci
          npm run build
          nohup npx next start --port 3000 > server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --max-time 5 --output /dev/null http://127.0.0.1:3000/login; then exit 0; fi
            sleep 2
          done
          echo "The app did not start."
          tail -n 40 server.log
          exit 1

      - name: Use the deployed site's secret
        if: steps.mode.outputs.mode == 'remote'
        run: echo "INGEST_SECRET=$REMOTE_INGEST_SECRET" >> "$GITHUB_ENV"

      - name: Run ingest steps
        run: |
          failed=0
          for path in \
            '/api/ingest/rss?limit=5&minScore=50' \
            '/api/ingest/products?limit=12' \
            '/api/ingest/github?limit=15&minStars=50&pruneDays=30' \
            '/api/ingest/research?limit=12&minScore=55&minFitScore=18' \
            '/api/ingest/external-trends' \
            '/api/ingest/trends'
          do
            status=000
            # One retry, because a free model or a source that is briefly down should not fail the day.
            for attempt in 1 2; do
              # GitHub and paper collection summarise each item with a free model and have taken over five minutes.
              status=$(curl --silent --show-error --max-time 600 --output /dev/null --write-out '%{http_code}' \
                --request POST --header "x-ingest-secret: $INGEST_SECRET" "$SITE_URL$path") || status=000
              case "$status" in
                2*) break ;;
              esac
              [ "$attempt" = 1 ] && sleep 20
            done
            echo "$path -> $status"
            case "$status" in
              2*) ;;
              *) failed=1 ;;
            esac
          done

          exit "$failed"

      - name: Show server log on failure
        if: failure() && steps.mode.outputs.mode == 'local'
        run: tail -n 80 server.log || true
