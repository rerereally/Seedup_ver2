<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기회 · Seedup</title>
<link rel="stylesheet" href="ui.css">
<style>
.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:28px 0 14px}
.tools .field{flex:1;min-width:220px;padding:4px 4px 4px 18px}
.tools .field input{font-size:15px;height:36px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);cursor:pointer}
.check input{accent-color:var(--hot);width:16px;height:16px}
.list{overflow:hidden}
.head,.row{display:grid;grid-template-columns:minmax(0,1fr) 120px 84px 84px 200px 24px;gap:16px;align-items:center;padding:0 22px}
.head{height:42px;border-bottom:1px solid var(--edge);font-size:12.5px;color:var(--mute)}
.row{padding-top:16px;padding-bottom:16px;border-bottom:1px solid var(--edge);transition:background .12s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--card2)}
.row .name{display:flex;align-items:center;gap:10px;font-weight:700}
.row .name i{width:22px;height:8px;border-radius:999px;flex:none}
.row p{margin:3px 0 0 32px;color:var(--mute);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .num{display:flex;align-items:center;gap:8px;font-weight:700}
.row .rival{font-size:13.5px;color:var(--mute);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .arrow{color:var(--dim)}
.row:hover .arrow{color:var(--fg)}
.none{padding:40px;text-align:center;color:var(--mute)}
@media (max-width:900px){.head{display:none}.row{grid-template-columns:minmax(0,1fr) auto;gap:8px 12px}.row .num,.row .rival,.row .arrow{display:none}.row p{white-space:normal}}
</style>
</head>
<body data-page="opps">
<main class="shell">
  <p class="label">2026. 11. 15.에 분석했습니다</p>
  <h1>살펴볼 기회</h1>
  <p class="desc">개발자들이 공개적으로 남긴 불만을 원문과 대조하고, 이미 있는 도구를 확인해 정리했습니다.</p>

  <div class="funnel" style="margin-top:28px">
    <div><span>원문과 일치한 증언</span><b class="mono">89</b><small>지어낸 문장은 여기서 탈락</small></div>
    <div><span>묶인 문제</span><b class="mono">60</b><small>같은 불만끼리 모음</small></div>
    <div><span>기준 통과</span><b class="mono">5</b><small>글 3건, 플랫폼 2종 이상</small></div>
    <div><span>지금 열린 기회</span><b class="mono">4</b><small>직접 경쟁이 아직 적음</small></div>
  </div>

  <div class="tools">
    <div class="field"><input id="q" placeholder="문제나 기술로 찾기" aria-label="기회 찾기"></div>
    <div class="seg" id="seg"><button class="now" data-s="">전체</button><button data-s="open">열림</button><button data-s="narrow">좁아지는 중</button><button data-s="closed">닫힘</button></div>
    <label class="check"><input type="checkbox" id="pass" checked>기준 통과만</label>
  </div>

  <div class="card list">
    <div class="head"><span>기회</span><span>상태</span><span>증언</span><span>플랫폼</span><span style="text-align:right">가장 큰 기존 도구</span><span></span></div>
    <div id="rows"></div>
  </div>
  <p class="muted small" style="margin-top:12px" id="count"></p>
</main>
<script src="ui.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let status = '';
function render() {
  const term = $('q').value.trim().toLowerCase();
  const list = OPPS.filter((o) => (!status || o.status === status) && (!$('pass').checked || o.pass) && (!term || `${o.name} ${o.problem}`.toLowerCase().includes(term)));
  $('rows').innerHTML = list.length ? list.map((o) => `<a class="row" href="opportunity.html">
    <div><div class="name"><i style="background:${o.c}"></i>${o.name}${o.pass ? ' <span class="pill pass">기준 통과</span>' : ''}</div><p>${o.problem}</p></div>
    <div>${statusPill(o.status)}</div>
    <div class="num">${bars(Math.min(3, o.ev), 3, o.c)}<span class="mono">${o.ev}</span></div>
    <div class="num">${bars(Math.min(2, o.plat), 2, o.c)}<span class="mono">${o.plat}</span></div>
    <div class="rival">${o.rival}</div><div class="arrow">→</div></a>`).join('') : '<div class="none">조건에 맞는 기회가 없습니다. "기준 통과만"을 끄면 근거가 아직 부족한 기회도 보입니다.</div>';
  $('count').textContent = `${list.length}개 표시 · 이 시안에는 60개 중 10개만 넣었습니다`;
}
$('q').addEventListener('input', render);
$('pass').addEventListener('change', render);
$('seg').addEventListener('click', (event) => { const el = event.target.closest('button'); if (!el) return; status = el.dataset.s; document.querySelectorAll('#seg button').forEach((b) => b.classList.toggle('now', b === el)); render(); });
render();
</script>
</body>
</html>
