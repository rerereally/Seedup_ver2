<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 씨앗 · Seedup</title>
<link rel="stylesheet" href="ui.css">
<style>
.find{display:flex;gap:10px;align-items:center;max-width:560px;margin-top:24px}
.find .field{flex:1}
.repo{margin-top:20px;overflow:hidden}
.repo>header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:20px 22px;border-bottom:1px solid var(--edge)}
.repo>header h2{font-size:19px}
.repo>header p{flex-basis:100%;margin:0;color:var(--mute);font-size:14px}
.repo .body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
.repo .body>div{padding:20px 22px}
.repo .body>div:first-child{border-right:1px solid var(--edge)}
.k{margin:0 0 10px;font-size:12.5px;font-weight:600;color:var(--mute)}
.match{display:block;padding:14px;border:1px solid var(--edge);border-radius:14px;background:var(--bg)}
.match:hover{border-color:var(--dim)}
.match b{display:block;margin:8px 0 2px}
.match small{color:var(--mute)}
.feat{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--edge)}
.feat:last-of-type{border:0}
.feat i{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--card3);font-style:normal;font-size:12px;font-weight:700}
.feat div{flex:1}.feat b{display:block}.feat small{color:var(--mute)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.paper{display:block;margin-top:8px;font-size:13.5px;color:var(--sub)}
@media (max-width:900px){.repo .body{grid-template-columns:minmax(0,1fr)}.repo .body>div:first-child{border-right:0;border-bottom:1px solid var(--edge)}.find{flex-wrap:wrap}}
</style>
</head>
<body data-page="seeds">
<main class="shell">
  <p class="label">내 씨앗</p>
  <h1>이미 만들고 있는 것에서 시작</h1>
  <p class="desc">GitHub 공개 저장소를 읽고, 지금 구조를 깨지 않으면서 붙일 수 있는 다음 기능을 실제 불만에서 찾아 드립니다.</p>
  <form class="find" onsubmit="return false"><div class="field"><span class="muted mono">github.com/</span><input value="rerereally" aria-label="GitHub 아이디"></div><button class="btn ink">저장소 불러오기</button></form>
  <p class="muted small" style="margin-top:10px">공개 저장소만 읽습니다. 토큰은 필요하지 않습니다. 아래는 결과가 어떻게 보이는지 보여주는 예시입니다.</p>

  <section id="repos"></section>
</main>
<script src="ui.js"></script>
<script>
// 저장소 이름은 실제 것이고, 연결된 기회와 기능 제안은 화면을 설명하기 위한 예시입니다.
const REPOS = [
  { name: 'rerereally/Seedup_ver2', lang: 'TypeScript', fresh: true, about: '개발자 불만을 원문과 대조해 근거 추적형 스펙을 만드는 서비스',
    match: OPPS[2], why: '키워드 6개가 겹칩니다: agent, mcp, spec, workflow, prompt, review',
    feats: [['스펙과 코드 변경 비교', 'PR이 기능의 완료 기준을 채웠는지 코멘트로 알림', 'E-1, E-3'], ['에이전트 작업 기록 보기', '에이전트가 어떤 지침으로 무엇을 바꿨는지 한 화면에', 'E-2'], ['팀 공용 지침 저장소', '여러 저장소가 같은 스펙을 참조', 'E-1']],
    paper: 'Cleaning an Agent’s History Hurts When the World Still Holds the Error' },
  { name: 'rerereally/my-llm-gateway', lang: 'Python', fresh: false, about: '여러 LLM 제공사를 하나의 호출로 감싸는 실험용 저장소 (예시)',
    match: OPPS[1], why: '키워드 4개가 겹칩니다: llm, provider, schema, api',
    feats: [['파라미터 매핑 표', '공통 파라미터를 제공사별 이름과 범위로 옮김', 'E-2, E-3'], ['지원하지 않는 파라미터 경고', '버려진 파라미터를 응답에 표시', 'E-2'], ['단일 호출 인터페이스', '모델 이름만 바꿔 다른 제공사 호출', 'E-1, E-3']],
    paper: 'ToolTurns: Benchmarking LLM Agents in Multi-Turn Dialogue' },
];
document.getElementById('repos').innerHTML = REPOS.map((r) => `<article class="card repo">
  <header><h2 class="mono">${r.name}</h2><span class="tag">${r.lang}</span>${r.fresh ? '<span class="pill hot">새 신호</span>' : ''}<p>${r.about}</p></header>
  <div class="body">
    <div><p class="k">가장 가까운 기회</p>
      <a class="match" href="opportunity.html">${statusPill(r.match.status)}<b>${r.match.name}</b><small>${r.why}</small></a>
      <p class="k" style="margin-top:18px">읽어볼 논문</p><a class="paper" href="#">${r.paper} ↗</a></div>
    <div><p class="k">다음에 붙일 기능 3가지</p>
      ${r.feats.map(([title, detail, cite], i) => `<div class="feat"><i>${i + 1}</i><div><b>${title}</b><small>${detail} · 근거 <span class="mono">${cite}</span></small></div><button class="btn sm">이슈 열기 ↗</button></div>`).join('')}
      <div class="acts"><a class="btn go" href="spec.html">기존 구조를 지키는 스펙 만들기 →</a><button class="btn">세 가지 복사</button></div></div>
  </div></article>`).join('');
</script>
</body>
</html>
