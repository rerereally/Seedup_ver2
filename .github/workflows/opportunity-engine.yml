name: Opportunity engine

on:
  schedule:
    # 07:00 KST every day. Scheduled runs only start from the default branch.
    # Each run is merged into the published result, so evidence builds up day by day.
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # Opens or updates one issue when a run fails.
  issues: write

# Two runs merging into the same result at once would overwrite each other.
concurrency:
  group: opportunity-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      OPENROUTER_FALLBACK_MODELS: ${{ vars.OPENROUTER_FALLBACK_MODELS }}
      OPENROUTER_FREE_ONLY: ${{ vars.OPENROUTER_FREE_ONLY }}
      RAG_EMBEDDING_MODEL: ${{ vars.RAG_EMBEDDING_MODEL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Web search for competitors and more quotes; without it the engine never searches the open web.
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      # Optional steadier model for the evidence top-up (for example "exaone", which needs EXAONE_API_KEY).
      ENGINE_EVIDENCE_MODEL: ${{ vars.ENGINE_EVIDENCE_MODEL }}
      # Optional: posts read per run (default 540) and below-bar problems searched per run (default 20).
      ENGINE_SAMPLE_LIMIT: ${{ vars.ENGINE_SAMPLE_LIMIT }}
      ENGINE_TOPUP_LIMIT: ${{ vars.ENGINE_TOPUP_LIMIT }}
      EXAONE_API_KEY: ${{ secrets.EXAONE_API_KEY }}
      # Mail is optional: without these three the digest step prints what it would send and stops.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NEWSLETTER_FROM_EMAIL: ${{ secrets.NEWSLETTER_FROM_EMAIL }}
      SEEDUP_SITE_URL: ${{ secrets.SEEDUP_SITE_URL }}
      # Lets the retry below skip collection and extraction, the slowest part of a run.
      ENGINE_CHECKPOINT: engine-checkpoint.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check required secrets
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ] || [ -z "$OPENROUTER_API_KEY" ] || [ -z "$OPENROUTER_MODEL" ]; then
            echo "NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SECRET_KEY, OPENROUTER_API_KEY secrets and the OPENROUTER_MODEL variable are required."
            exit 1
          fi
      # A hand-run SQL file that was never applied breaks features quietly; this names the file to run.
      - name: Check the database has every SQL change
        id: schema
        continue-on-error: true
        run: npx tsx scripts/check-schema.ts
      - name: Report a missing database change
        if: steps.schema.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="DB에 적용하지 않은 SQL 파일이 있습니다"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          body="어떤 파일인지는 실행 기록의 오류 줄에 있습니다: $RUN_URL"
          if [ -n "$number" ]; then gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi
      - name: Run the engine
        id: first
        continue-on-error: true
        run: npx tsx scripts/run-opportunity-engine.ts --persist
      # Free models fail in bursts, so one retry a few minutes later recovers most failed runs.
      - name: Retry once from the checkpoint
        if: steps.first.outcome == 'failure'
        run: |
          sleep 300
          npx tsx scripts/run-opportunity-engine.ts --persist
      # A mail problem must never mark a good engine run as failed.
      - name: Mail subscribers about changes
        continue-on-error: true
        run: |
          npx tsx scripts/send-opportunity-digest.ts --kind changes
          # The schedule fires at 07:00 KST, so this is Monday morning in Korea.
          if [ "$(TZ=Asia/Seoul date +%u)" = "1" ]; then npx tsx scripts/send-opportunity-digest.ts --kind weekly; fi
      - name: Report the failure in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="기회 엔진 실행이 실패했습니다"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "실행: $RUN_URL"
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "실행: $RUN_URL"; fi
