<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 2 · 주석 문서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{--bg:#08080a;--card:#131316;--edge:#2a2a2f;--fg:#f4f4f5;--mute:#a1a1a8;--hot:#ff6a1f;--good:#3ddc84;--paper:#fbfbfa;--print:#111113;--rule:#deded9;--soft:#6b6b70}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;font-size:15px;line-height:1.6}
.mono{font-family:"Geist Mono",ui-monospace,Consolas,monospace}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:12px 28px;background:rgba(8,8,10,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--edge)}
.top strong{font-weight:600}
.tabs{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--card);border:1px solid var(--edge);margin-left:8px}
.tabs span{padding:5px 14px;border-radius:999px;font-size:13.5px;color:var(--mute)}
.tabs .now{background:var(--fg);color:#111;font-weight:600}
.spacer{flex:1}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--edge);border-radius:999px;padding:7px 14px;cursor:pointer}
button.go{background:var(--hot);border-color:var(--hot);color:#160700;font-weight:700}
.wrap{display:grid;grid-template-columns:340px minmax(0,760px);gap:36px;justify-content:center;padding:28px 28px 120px}
.rail{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:12px}
.rail h2{margin:0;font-size:13px;color:var(--mute);font-weight:600;letter-spacing:.04em}
.src{background:var(--card);border:1px solid var(--edge);border-left:3px solid var(--edge);border-radius:12px;padding:14px;cursor:pointer;text-align:left;color:var(--fg);transition:border-color .15s,opacity .15s}
.src.on{border-color:var(--hot)}
.rail.picked .src:not(.on){opacity:.35}
.src .id{font-size:12px;color:var(--hot);font-weight:700}
.src q{display:block;margin:6px 0;font-size:14.5px;quotes:"“" "”"}
.src small{display:block;color:var(--mute);font-size:13px}
.src .meta{display:flex;gap:8px;margin-top:10px;font-size:12px;color:var(--mute)}
.src .ok{color:var(--good);font-weight:600}
.count{font-size:13px;color:var(--mute);min-height:20px}
.count b{color:var(--hot)}
.paper{background:var(--paper);color:var(--print);border-radius:6px;padding:56px 64px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.paper h1{margin:0 0 6px;font-size:30px;font-weight:600;letter-spacing:-.02em}
.paper .sub{color:var(--soft);margin:0 0 30px;font-size:14px}
.paper h2{margin:34px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--rule);font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--soft)}
.paper p{margin:0 0 10px}
.item{position:relative;margin:0 -14px 6px;padding:10px 14px;border-radius:8px;cursor:pointer;transition:background .15s,opacity .15s}
.item:hover{background:#f1f0ec}
.item.on{background:#fff1e8;box-shadow:inset 3px 0 0 var(--hot)}
.paper.picked .item[data-id]:not(.on){opacity:.35}
.item b{font-weight:600}
.item .id{font-size:12px;color:var(--soft);margin-right:8px}
.cite{display:inline-block;margin-left:6px;padding:0 6px;border-radius:5px;background:#ececE8;color:#444;font-size:11.5px;vertical-align:1px}
.item.on .cite{background:var(--hot);color:#fff}
.hyp{margin-top:8px;padding:16px 18px;border:1.5px dashed #b9b9b2;border-radius:10px;background:#f6f5f1}
.hyp .item{cursor:default;color:#55554f}
.hyp .item:hover{background:transparent}
.hyp .note{font-size:13px;color:var(--soft);margin:0 0 6px}
.ask{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:10px;width:min(720px,calc(100% - 40px));padding:8px 8px 8px 18px;border-radius:999px;background:var(--card);border:1px solid #3a3a41;box-shadow:0 16px 50px rgba(0,0,0,.6)}
.ask input{flex:1;border:0;background:transparent;color:var(--fg);font:inherit;outline:none}
.ask span{align-self:center;font-size:12.5px;color:var(--mute);white-space:nowrap}
@media (max-width:980px){.wrap{grid-template-columns:1fr}.rail{position:static}.paper{padding:32px 24px}.tabs{display:none}}
</style>
</head>
<body>
<div class="top">
  <strong id="title"></strong>
  <div class="tabs"><span class="now">문서</span><span>근거 추적</span><span>구조 트리</span><span>유저플로우</span></div>
  <div class="spacer"></div>
  <button>공유 링크</button><button class="go">에이전트에 넘기기</button>
</div>

<div class="wrap">
  <aside class="rail" id="rail">
    <h2>이 문서가 기대는 원문</h2>
    <div class="count" id="count">문장을 누르면 그 문장의 근거가 켜집니다.</div>
  </aside>

  <article class="paper" id="paper">
    <h1 id="h1"></h1>
    <p class="sub">근거 기준 통과 · 증언 3건 · 플랫폼 2종 · 이미 있는 도구 4개</p>

    <h2>해결할 문제</h2>
    <p id="problem"></p>
    <h2>기존 도구가 남긴 빈틈</h2>
    <p id="gap"></p>

    <h2>요구사항</h2><div id="R"></div>
    <h2>기능</h2><div id="F"></div>
    <h2>화면</h2><div id="Sc"></div>

    <h2>검증이 필요한 가설</h2>
    <div class="hyp"><p class="note">뒷받침하는 원문이 없어 요구사항에서 뺐습니다. 사용자에게 확인하기 전에는 만들지 않습니다.</p><div id="H"></div></div>
  </article>
</div>

<form class="ask" onsubmit="return false">
  <input placeholder="예: 대상을 1인 개발자로 좁혀 줘" aria-label="수정 지시">
  <span>원문은 바뀌지 않습니다</span>
  <button class="go">수정</button>
</form>

<script src="shared.js"></script>
<script>
const S = window.SPEC;
title.textContent = S.title; h1.textContent = S.title + ' PRD'; problem.textContent = S.problem; gap.textContent = S.gap;
rail.querySelector('h2').insertAdjacentHTML('afterend', S.evidence.map((e) => `<button class="src" data-id="${e.id}"><span class="id mono">${e.id}</span><q>${e.quote}</q><small>${e.ko}</small><div class="meta"><span>${e.platform}</span><span class="mono">${e.date}</span><span class="ok">원문 일치</span></div></button>`).join(''));
const row = (x) => `<div class="item" data-id="${x.id}"><span class="id mono">${x.id}</span><b>${x.title}.</b> ${x.detail}${x.up.map((u) => `<span class="cite mono">${u}</span>`).join('')}</div>`;
R.innerHTML = S.requirements.map(row).join('');
F.innerHTML = S.features.map(row).join('');
Sc.innerHTML = S.screens.map(row).join('');
H.innerHTML = S.hypotheses.map((h) => `<div class="item"><span class="id mono">${h.id}</span><b>${h.title}.</b> ${h.detail}</div>`).join('');

let picked = null;
function pick(id) {
  picked = picked === id ? null : id;
  const ids = picked ? traceOf(picked) : new Set();
  paper.classList.toggle('picked', Boolean(picked));
  rail.classList.toggle('picked', Boolean(picked));
  document.querySelectorAll('[data-id]').forEach((el) => el.classList.toggle('on', ids.has(el.dataset.id)));
  const sources = [...ids].filter((x) => x.startsWith('E')).length;
  const lines = [...ids].filter((x) => !x.startsWith('E')).length;
  count.innerHTML = !picked ? '문장을 누르면 그 문장의 근거가 켜집니다.'
    : picked.startsWith('E') ? `<b>${picked}</b> 에 기대는 문장 ${lines}개`
    : `<b>${picked}</b> 의 근거 원문 ${sources}건`;
}
document.addEventListener('click', (event) => { const el = event.target.closest('[data-id]'); if (el) pick(el.dataset.id); });
if (location.hash === '#demo') pick('E-2');
</script>
</body>
</html>
