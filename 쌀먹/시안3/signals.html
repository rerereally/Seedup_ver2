<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>읽을거리 · Seedup</title>
<link rel="stylesheet" href="ui.css">
<style>
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:28px 0 16px}
.bar p{margin:0 0 0 auto;color:var(--mute);font-size:13.5px}
.list{overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:20px;align-items:center;padding:16px 22px;border-bottom:1px solid var(--edge)}
.row:last-child{border:0}
.row small{color:var(--mute)}
.row b{display:block;margin:2px 0}
.row p{margin:0;color:var(--mute);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rel{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--edge);border-radius:12px;background:var(--bg);font-size:13px}
.rel:hover{border-color:var(--dim)}
.rel span{color:var(--mute);font-size:12px}
.rel.none{border-style:dashed;color:var(--dim)}
.pane{display:none}.pane.now{display:block}
@media (max-width:900px){.row{grid-template-columns:minmax(0,1fr)}.row p{white-space:normal}.bar p{margin-left:0}}
</style>
</head>
<body data-page="signals">
<main class="shell">
  <p class="label">읽을거리</p>
  <h1>기회의 배경이 되는 신호</h1>
  <p class="desc">아티클, 트렌드, 오픈소스, AI 제품을 한곳에 모았습니다. 각 항목 옆에는 그 주제와 이어지는 기회가 붙습니다.</p>

  <div class="bar"><div class="seg" id="seg"><button class="now" data-t="news">아티클</button><button data-t="trends">트렌드</button><button data-t="oss">오픈소스</button><button data-t="products">AI 제품</button></div><p>지금 사이트의 메뉴 다섯 개를 이 한 화면으로 합쳤습니다</p></div>

  <div class="card list">
    <div class="pane now" id="news"></div><div class="pane" id="trends"></div><div class="pane" id="oss"></div><div class="pane" id="products"></div>
  </div>
</main>
<script src="ui.js"></script>
<script>
// 제목은 지금 사이트 화면에 보이는 것이고, 옆에 붙인 "이어지는 기회"는 화면을 설명하기 위한 예시 연결입니다.
const DATA = {
  news: [['논문 · arXiv', 'VASTRA: Efficient Agentic Top-K Interactive Video Analysis', '에이전트가 긴 영상에서 필요한 구간만 골라 보는 방법', 2], ['논문 · arXiv', 'Cleaning an Agent’s History Hurts When the World Still Holds the Error', '에이전트 기록을 지우면 왜 오히려 실수가 반복되는가', 4], ['논문 · arXiv', 'Where LLM Agents Get Stuck Debugging Databases', 'LLM 에이전트가 데이터베이스 디버깅에서 막히는 지점', 7], ['논문 · arXiv', 'ToolTurns: Benchmarking LLM Agents in Multi-Turn Dialogue', '여러 차례 대화에서 도구를 쓰는 에이전트 평가', null]],
  trends: [['점수 89', 'AI Code Review', '코드 리뷰를 AI에게 맡기는 흐름', 2], ['점수 89', 'RAG Evaluation', '검색 증강 생성의 품질을 재는 방법', null], ['점수 88', 'LLM Observability', 'LLM 호출을 추적하고 비용을 보는 도구', 1], ['점수 84', 'MCP Server Design', '에이전트용 도구 서버를 설계하는 방식', 6]],
  oss: [['Rust · ★11.9k', 'lancedb/lancedb', '임베딩 검색을 위한 내장형 벡터 데이터베이스', null], ['Python · ★11.3k', 'cocoindex-io/cocoindex', '변경분만 다시 색인하는 데이터 변환 프레임워크', null], ['TypeScript', 'CopilotKit/OpenBot', '에이전트를 앱 안에 넣는 프레임워크', 2], ['Python', 'omnigent-ai/omnigent', '여러 코딩 에이전트를 한 곳에서 제어', 4]],
  products: [['AI Coding', 'CodeMesh', 'AI 코딩 도구의 작업 내용을 한눈에', 2], ['AI Search', 'Businesses in ChatGPT', '챗봇 안에서 업체 정보를 찾는 기능', null], ['AI Coding', 'Tminn MCP', 'MCP 서버를 빠르게 만드는 도구', 6], ['기타', 'StockFlip', '재고 사진을 정리하는 도구', null]],
};
for (const [key, rows] of Object.entries(DATA)) {
  document.getElementById(key).innerHTML = rows.map(([kind, title, about, opp]) => `<div class="row"><div><small>${kind}</small><b>${title}</b><p>${about}</p></div>${opp === null ? '<div class="rel none">이어지는 기회 없음</div>' : `<a class="rel" href="opportunity.html"><span>이어지는 기회</span>${OPPS[opp].name} →</a>`}</div>`).join('');
}
document.getElementById('seg').addEventListener('click', (event) => {
  const el = event.target.closest('button');
  if (!el) return;
  document.querySelectorAll('#seg button').forEach((b) => b.classList.toggle('now', b === el));
  document.querySelectorAll('.pane').forEach((p) => p.classList.toggle('now', p.id === el.dataset.t));
});
</script>
</body>
</html>
