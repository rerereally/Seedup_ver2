name: Scheduled ingest

on:
  schedule:
    # 06:00 KST every day. Scheduled runs only start from the default branch.
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SITE_URL: ${{ secrets.SEEDUP_SITE_URL }}
      INGEST_SECRET: ${{ secrets.SEEDUP_INGEST_SECRET }}
    steps:
      - name: Run ingest steps
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$INGEST_SECRET" ]; then
            echo "SEEDUP_SITE_URL and SEEDUP_INGEST_SECRET repository secrets are required."
            exit 1
          fi

          failed=0
          for path in \
            '/api/ingest/rss?limit=5&minScore=50' \
            '/api/ingest/products?limit=12' \
            '/api/ingest/github?limit=15&minStars=50&pruneDays=30' \
            '/api/ingest/research?limit=12&minScore=55&minFitScore=18' \
            '/api/ingest/external-trends' \
            '/api/ingest/trends'
          do
            status=$(curl --silent --show-error --max-time 300 --output /dev/null --write-out '%{http_code}' \
              --request POST --header "x-ingest-secret: $INGEST_SECRET" "$SITE_URL$path" || echo 000)
            echo "$path -> $status"
            case "$status" in
              2*) ;;
              *) failed=1 ;;
            esac
          done

          exit "$failed"
